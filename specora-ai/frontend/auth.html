<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — Specora AI</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

    <!-- Icon sprite. Stroke-based, 24px grid, inherits currentColor.
         Kept inline so <use> resolves without waiting on script. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <g id="ic-defaults"></g>
      </defs>
      <symbol id="i-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12h3l2.5-6.5L11 18l2.5-9L16 12h6"/>
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.6 12 3.5l9 7.1"/><path d="M5.6 9.4V20h12.8V9.4"/><path d="M10 20v-5h4v5"/>
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/>
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.2 1.9"/>
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3.5H7a1.5 1.5 0 0 0-1.5 1.5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8z"/>
        <path d="M14 3.5V8h4.5"/><path d="M9 13h6M9 16.5h4"/>
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h4L19 9a2.5 2.5 0 0 0-3.5-3.5L4 16.5z"/><path d="M14.5 6.5 17.5 9.5"/>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5v11"/><path d="m8 10.8 4 3.9 4-3.9"/><path d="M4.5 16.5v2A2 2 0 0 0 6.5 20.5h11a2 2 0 0 0 2-2v-2"/>
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15V4"/><path d="m8 7.7 4-3.9 4 3.9"/><path d="M4.5 16.5v2A2 2 0 0 0 6.5 20.5h11a2 2 0 0 0 2-2v-2"/>
      </symbol>
      <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 4.5h3A2 2 0 0 1 19.5 6.5v11a2 2 0 0 1-2 2h-3"/><path d="M10 16.5 5.5 12 10 7.5"/><path d="M5.5 12H15"/>
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m6.5 9.5 5.5 5.5 5.5-5.5"/>
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.8" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3.2"/>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 5.5v13l11-6.5z"/>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 5v14M14.5 5v14"/>
      </symbol>
      <symbol id="i-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 6.5h15"/><path d="M9.5 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h2.4a1.3 1.3 0 0 1 1.3 1.3V6.5"/>
        <path d="M6.5 6.5 7.4 19a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.9-12.5"/><path d="M10.5 10v6.5M13.5 10v6.5"/>
      </symbol>
      <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5c0 4 1.6 5.6 5.6 5.6-4 0-5.6 1.6-5.6 5.6 0-4-1.6-5.6-5.6-5.6 4 0 5.6-1.6 5.6-5.6z"/>
        <path d="M18 15.5c0 2 .8 2.8 2.8 2.8-2 0-2.8.8-2.8 2.8 0-2-.8-2.8-2.8-2.8 2 0 2.8-.8 2.8-2.8z"/>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12.5 4.5 4.5L19 7"/>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 7.8v5"/><path d="M12 16.2h.01"/>
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3v4M16 3v4"/>
      </symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 13.5h4l1.5 3h6l1.5-3h4"/><path d="M6 4.5h12l2.5 9v5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-5z"/>
      </symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12h14"/><path d="m13 6.5 5.5 5.5-5.5 5.5"/>
      </symbol>
      <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.6 6.5 8.4 6 8.4-6"/>
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20.2a7.4 7.4 0 0 1 14.4 0"/>
      </symbol>
      <symbol id="i-database" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/>
      </symbol>
      <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3 9 4.8-9 4.8-9-4.8z"/><path d="m3 12.5 9 4.8 9-4.8"/>
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/>
      </symbol>
      <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="m8.5 8-4.5 4 4.5 4"/><path d="m15.5 8 4.5 4-4.5 4"/>
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19.5 12h-14"/><path d="m11 6.5-5.5 5.5 5.5 5.5"/>
      </symbol>
    </svg>


<div id="notif" class="notif">
  <span id="notif-icon"><svg class="ic" aria-hidden="true"><use href="#i-check"></use></svg></span>
  <span id="notif-msg">Done</span>
</div>

<div class="auth-container">
  <div class="auth-card" id="auth-card">
    
    <div class="auth-logo">
      <div class="logo-icon"><svg class="ic" aria-hidden="true"><use href="#i-logo"></use></svg></div>
      <div class="logo-text">Specora<span>AI</span></div>
    </div>

    <!-- ─── FORM VIEW: Login / Signup ─── -->
    <div id="view-form" class="auth-view active">
      <h1 id="auth-title">Welcome back</h1>
      <p id="auth-subtitle" class="text2 mb24">Enter your email to sign in</p>

      <div class="tab-bar mb24">
        <button class="tab-btn active" id="tab-login" onclick="Auth.switchTab('login')">Login</button>
        <button class="tab-btn" id="tab-signup" onclick="Auth.switchTab('signup')">Sign Up</button>
      </div>

      <form id="auth-form" onsubmit="Auth.handleAuthSubmit(event)">
        <div id="name-group" class="form-group" style="display:none;">
          <label>Full Name</label>
          <input type="text" id="name-input" placeholder="e.g. Jane Doe">
        </div>
        
        <div class="form-group mb16">
          <label>Email Address</label>
          <input type="email" id="email-input" placeholder="name@company.com" required>
        </div>

        <div class="form-group mb16">
          <label>Password</label>
          <input type="password" id="password-input" placeholder="••••••••" required>
        </div>

        <div id="confirm-password-group" class="form-group mb24" style="display:none;">
          <label>Confirm Password</label>
          <input type="password" id="confirm-password-input" placeholder="••••••••">
        </div>

        <div class="form-helper-row" id="forgot-link">
          <button type="button" class="link-btn" onclick="Auth.openForgotPassword()">Forgot password?</button>
        </div>

        <button type="submit" class="btn btn-primary full-w btn-lg" id="submit-btn" style="justify-content:center;">
          <span id="btn-spinner" style="display:none;" class="spinner-small"></span>
          <span id="btn-text">Sign In</span>
        </button>
      </form>
    </div>

    <!-- ─── VERIFY VIEW: OTP Input ─── -->
    <div id="view-verify" class="auth-view" style="display:none;">
      <button class="back-btn mb16" onclick="Auth.goBack()"><svg class="ic" aria-hidden="true"><use href="#i-back"></use></svg> Back</button>
      <h1>Check your email</h1>
      <p class="text2 mb24">We've sent a 6-digit verification code to <strong class="text" id="verify-email-display"></strong></p>

      <form id="otp-form" onsubmit="Auth.handleOtpSubmit(event)">
        <div class="otp-container mb24">
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
          <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
        </div>

        <button type="submit" class="btn btn-primary full-w btn-lg" id="verify-btn" style="justify-content:center;">
          <span id="verify-spinner" style="display:none;" class="spinner-small"></span>
          <span id="verify-text">Verify & Proceed</span>
        </button>
      </form>

      <div class="resend-text mt16 center">
        <span class="text2 text-sm">Didn't receive a code?</span>
        <button class="btn btn-ghost btn-sm" id="resend-btn" onclick="Auth.resendOtp()" style="border:none;padding:4px 8px;">Resend</button>
      </div>
    </div>

    <!-- ─── FORGOT PASSWORD VIEW ─── -->
    <div id="view-forgot" class="auth-view" style="display:none;">
      <button class="back-btn mb16" onclick="Auth.exitForgotPassword()"><svg class="ic" aria-hidden="true"><use href="#i-back"></use></svg> Back to login</button>
      <h1>Reset your password</h1>
      <p class="text2 mb24" id="forgot-subtitle">Enter your email to receive a reset code.</p>

      <form id="forgot-form" onsubmit="Auth.handleForgotSubmit(event)">
        <div class="form-group mb16">
          <label>Email Address</label>
          <input type="email" id="forgot-email-input" placeholder="name@company.com" required>
        </div>

        <div id="forgot-otp-section" class="form-group mb16" style="display:none;">
          <label>Verification Code</label>
          <div class="otp-container">
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
          </div>
        </div>

        <div id="forgot-password-section" style="display:none;">
          <div class="form-group mb16">
            <label>New Password</label>
            <input type="password" id="forgot-new-password-input" placeholder="••••••••">
          </div>
          <div class="form-group mb24">
            <label>Confirm New Password</label>
            <input type="password" id="forgot-confirm-password-input" placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="btn btn-primary full-w btn-lg" id="forgot-submit-btn" style="justify-content:center;">
          <span id="forgot-spinner" style="display:none;" class="spinner-small"></span>
          <span id="forgot-submit-text">Send Reset Code</span>
        </button>
      </form>
    </div>

  </div>
</div>

<!-- Keep this version query in step with index.html — both pages load the
     same api.js and a stale copy breaks them the same way. -->
<script src="api.js?v=1.3"></script>
<script src="auth.js?v=1.3"></script>
</body>
</html>
